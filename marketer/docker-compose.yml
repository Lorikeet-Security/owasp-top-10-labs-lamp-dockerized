version: '3.8'

services:
  web:
    build: .
    container_name: marketer
    ports:
      - "80:80"
      - "22:22"
    depends_on:
      - db
    networks:
      - lab-network

  db:
    image: mysql:5.7
    container_name: marketer-db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: marketer
      MYSQL_USER: webadmin
      MYSQL_PASSWORD: emailserver123$
    volumes:
      - ./src/sql:/docker-entrypoint-initdb.d
    networks:
      - lab-network

networks:
  lab-network:
    driver: bridge
