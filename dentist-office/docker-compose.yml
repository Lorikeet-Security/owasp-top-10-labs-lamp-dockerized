version: "3.9"
    
services:
  db:
    image: mysql:5.7
    volumes:
      - db_data:/var/lib/mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: brad28
      MYSQL_DATABASE: wordpress
      MYSQL_USER: brad
      MYSQL_PASSWORD: brad28
    
  wordpress:
    depends_on:
      - db
    image: dentist_wordpress
    build:
        context: .
        dockerfile: ./Dockerfile
    volumes:
      - wordpress_data:/var/www/html
    ports:
      - "80:80"
    restart: always
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: brad 
      WORDPRESS_DB_PASSWORD: brad28
      WORDPRESS_DB_NAME: wordpress
volumes:
  db_data: {}
  wordpress_data: {}
